<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b2a">
<title>Poker Jetons</title>
<style>
  :root { --felt:#0d3b2a; --felt2:#145c41; --card:#0a2e21; --line:#1f6b4d; --text:#f2f5f0; --muted:#9fc2b1; --gold:#f2c14e; --red:#e05a4f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color:var(--text);
         background:radial-gradient(ellipse at top, var(--felt2), var(--felt) 70%); background-attachment:fixed; }
  main { max-width:440px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:34px; margin:8px 0 4px; letter-spacing:-.5px; }
  h1 span { color:var(--gold); }
  .sub { color:var(--muted); margin:0 0 28px; line-height:1.45; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; }
  h2 { font-size:17px; margin:0 0 14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input { width:100%; font-size:17px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#06231a; color:var(--text); outline:none; }
  input:focus { border-color:var(--gold); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { width:100%; margin-top:18px; padding:14px; font-size:17px; font-weight:700; border:0; border-radius:12px; cursor:pointer;
           background:var(--gold); color:#2a1d00; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.6; }
  .err { color:var(--red); font-size:14px; margin-top:10px; min-height:1em; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .suits { font-size:22px; letter-spacing:6px; color:var(--muted); }
  .suits b { color:var(--red); font-weight:400; }
</style>
</head>
<body>
<main>
  <div class="suits">♠<b>♥</b>♣<b>♦</b></div>
  <h1>Poker <span>Jetons</span></h1>
  <p class="sub">Vous avez les cartes, on s'occupe des jetons. Chacun mise depuis son téléphone, le pot est partagé en direct.</p>

  <form class="panel" id="create">
    <h2>Créer une partie</h2>
    <label for="name">Ton pseudo</label>
    <input id="name" maxlength="20" autocomplete="nickname" required placeholder="ex. Camille">
    <label for="stack">Jetons de départ par joueur</label>
    <input id="stack" type="number" inputmode="numeric" min="1" value="1000" required>
    <div class="row">
      <div><label for="sb">Petite blinde</label><input id="sb" type="number" inputmode="numeric" min="0" value="10"></div>
      <div><label for="bb">Grosse blinde</label><input id="bb" type="number" inputmode="numeric" min="0" value="20"></div>
    </div>
    <div class="hint">Mets 0 pour jouer sans blindes automatiques.</div>
    <button type="submit">Créer la table</button>
    <div class="err" id="createErr"></div>
  </form>

  <form class="panel" id="join">
    <h2>Rejoindre avec un code</h2>
    <input id="code" maxlength="6" placeholder="ex. K7MPQ3" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:3px">
    <button type="submit" class="secondary">Rejoindre</button>
  </form>
</main>
<script>
  const $ = id => document.getElementById(id);
  $('name').value = localStorage.getItem('pj_name') || '';
  $('create').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true; $('createErr').textContent = '';
    try {
      const r = await fetch('/api/create', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name:$('name').value, stack:$('stack').value, sb:$('sb').value||0, bb:$('bb').value||0 }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      localStorage.setItem('pj_name', $('name').value.trim());
      localStorage.setItem('pj_' + d.code, d.token);
      location.href = '/g/' + d.code;
    } catch (err) { $('createErr').textContent = err.message || 'Erreur réseau'; btn.disabled = false; }
  };
  $('join').onsubmit = e => {
    e.preventDefault();
    const c = $('code').value.trim().toUpperCase();
    if (c) location.href = '/g/' + c;
  };
</script>
</body>
</html>
